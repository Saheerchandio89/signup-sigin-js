
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #312e81);
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .3);
        }

        h1 {
            text-align: center;
            color: #111827;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: bold;
            color: #374151;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #4f46e5;
        }

        .error {
            color: #dc2626;
            font-size: 12px;
            min-height: 15px;
            margin: 5px 0;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        .link {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #4f46e5;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Create Account</h1>

        <p class="subtitle">Create your new account</p>

        <form id="signupForm">

            <label>Email</label>
            <input type="email" id="email" placeholder="Enter email">
            <p id="erroremail" class="error"></p>


            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password">
            <p id="errorpassword" class="error"></p>


            <label>Age</label>
            <input type="number" id="age" placeholder="Enter age">
            <p id="errorage" class="error"></p>


            <label>Country</label>

            <select id="country">

                <option value="">Select Country</option>
                <option value="Pakistan">Pakistan</option>
                <option value="India">India</option>
                <option value="China">China</option>
                <option value="Saudi Arabia">Saudi Arabia</option>

            </select>

            <p id="errorcountry" class="error"></p>


            <label>Date of Birth</label>
            <input type="date" id="dob">
            <p id="errordob" class="error"></p>


            <button type="submit">
                Signup
            </button>

        </form>


        <div class="link">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>


    <script src="app.js"></script>

</body>

</html>
